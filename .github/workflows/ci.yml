name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # main 以外は、新しい push があれば古い実行を取り消す
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  VOICEVOX_IMAGE: voicevox/voicevox_engine:cpu-0.25.2

jobs:
  test:
    name: テスト (Node.js ${{ matrix.node }})
    # 同じリポジトリのブランチは push で実行するので、pull_request ではフォークからの PR だけを実行する
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    env:
      # 描画の結合テストを省略させない
      DOPAGAKIX_TEST_REQUIRE_RENDER: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: 描画に使う Chromium と ffmpeg を入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          npx playwright-core install --with-deps --only-shell chromium
      - run: npm run typecheck
      - run: npm test

  package:
    name: git からの導入
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 利用者と同じ経路(git から npm install -g)で導入する
        run: npm install -g "git+file://$GITHUB_WORKSPACE"
      - name: 描画に使う Chromium と ffmpeg を入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          node "$(npm root -g)/dopagakix/node_modules/playwright-core/cli.js" install --with-deps --only-shell chromium
      - name: コマンドとスキルの導入を確かめる
        run: |
          dopagakix --version
          dopagakix install-skill -p "$RUNNER_TEMP/project"
          test -f "$RUNNER_TEMP/project/.claude/skills/video-report/SKILL.md"
      - name: 同梱のサンプルから動画を作る
        run: |
          out="$RUNNER_TEMP/sample/summary.mp4"
          dopagakix render "$(npm root -g)/dopagakix/examples/script.example.json" --no-voice --fps 2 -o "$out"
          streams=$(ffprobe -v error -show_entries stream=codec_name,width,height -of csv=p=0 "$out")
          echo "$streams"
          grep -q "^h264,1080,1920" <<< "$streams"
      - name: 同梱の会話の要約を確かめ、動画を作る
        run: |
          example="$(npm root -g)/dopagakix/examples/conversation.example.json"
          # 警告があれば失敗にする(同梱の例は、警告のない台本にしておく)
          dopagakix check "$example" --no-voice --persona zundamon --json > "$RUNNER_TEMP/conversation-check.json"
          node -e 'const r = require(process.argv[1]); if (r.kind !== "conversation" || r.issues.length) { console.error(r.issues); process.exit(1); }' "$RUNNER_TEMP/conversation-check.json"
          out="$RUNNER_TEMP/conversation/summary.mp4"
          dopagakix render "$example" --no-voice --fps 2 -o "$out" --work-dir "$RUNNER_TEMP/conversation-work"
          test "$(ls "$RUNNER_TEMP/conversation")" = "summary.mp4"
          streams=$(ffprobe -v error -show_entries stream=codec_name,width,height -of csv=p=0 "$out")
          echo "$streams"
          grep -q "^h264,1080,1920" <<< "$streams"

  voicevox:
    name: VOICEVOX との結合
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOPAGAKIX_TEST_REQUIRE_VOICEVOX: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: VOICEVOX ENGINE を起動する
        run: |
          docker run -d --name voicevox -p 127.0.0.1:50021:50021 "$VOICEVOX_IMAGE"
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:50021/version; then echo; exit 0; fi
            sleep 2
          done
          docker logs voicevox
          exit 1
      - name: 描画に使う Chromium と ffmpeg を入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          npx playwright-core install --with-deps --only-shell chromium
      - name: 実エンジンを使うテスト
        # BGM 付き・効果音付きの動画で、読み上げ中に BGM が下がること、効果音が決めた時刻に鳴り読み上げと重ならないことも確かめる
        run: npx vitest run test/tts.test.ts test/readings.test.ts test/cli.test.ts test/conversation.test.ts test/environment.test.ts test/bgm.test.ts test/sfx.test.ts
      - name: 読み上げ付きの動画を作る
        run: |
          out="$RUNNER_TEMP/voiced/summary.mp4"
          # render は check で確かめた読みでだけ音声を作るため、台本を作業場所に写して先に check する
          mkdir -p "$RUNNER_TEMP/voiced"
          cp examples/script.example.json "$RUNNER_TEMP/voiced/script.json"
          node dist/cli.js check "$RUNNER_TEMP/voiced/script.json"
          node dist/cli.js render "$RUNNER_TEMP/voiced/script.json" --fps 4 -o "$out"
          audio=$(ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 "$out")
          echo "音声: $audio"
          test "$audio" = "aac"
          # 無音でないこと(読み上げが入っていること)を音量で確かめる
          volume=$(ffmpeg -hide_banner -i "$out" -af volumedetect -f null - 2>&1 | sed -n 's/.*max_volume: \(.*\) dB/\1/p')
          echo "最大音量: $volume dB"
          test -n "$volume"
          awk -v v="$volume" 'BEGIN { exit !(v > -40) }'
          # BGM がなくても、全体の音量を -16 ±1 LUFS・トゥルーピーク -1.5 dBTP 以下にそろえている
          # (mp4 は AAC への変換でピークが上がるため、-1 dBTP 以下を確かめる)
          ./.github/scripts/check-loudness.sh "$RUNNER_TEMP/voiced/audio.wav" -1.5
          ./.github/scripts/check-loudness.sh "$out" -1
      - name: BGM 付きの動画を作る
        run: |
          # ライセンス上の問題がない合成音(60 Hz の正弦波、10 秒)を BGM にする。動画より短いのでループする
          ffmpeg -hide_banner -loglevel error -f lavfi -i sine=frequency=60:duration=10 "$RUNNER_TEMP/sine60.wav"
          out="$RUNNER_TEMP/voiced-bgm/summary.mp4"
          mkdir -p "$RUNNER_TEMP/voiced-bgm"
          cp examples/script.example.json "$RUNNER_TEMP/voiced-bgm/script.json"
          node dist/cli.js check "$RUNNER_TEMP/voiced-bgm/script.json"
          node dist/cli.js render "$RUNNER_TEMP/voiced-bgm/script.json" --fps 4 --bgm "$RUNNER_TEMP/sine60.wav" --bgm-credit "BGM: 60 Hz の合成音" -o "$out"
          ./.github/scripts/check-loudness.sh "$RUNNER_TEMP/voiced-bgm/audio.wav" -1.5
          ./.github/scripts/check-loudness.sh "$out" -1
          grep -q '"credit": "BGM: 60 Hz の合成音"' "$RUNNER_TEMP/voiced-bgm/script.json"
      - name: 効果音付きの動画を作る
        run: |
          # 効果音ラボの音源は使わず、ffmpeg で作った合成音(2 kHz の正弦波、0.2 秒)を効果音にする
          sfx="$RUNNER_TEMP/sfx"
          mkdir -p "$sfx"
          for kind in page result end; do
            ffmpeg -hide_banner -loglevel error -f lavfi -i sine=frequency=2000:duration=0.2 "$sfx/$kind.wav"
          done
          out="$RUNNER_TEMP/voiced-sfx/summary.mp4"
          mkdir -p "$RUNNER_TEMP/voiced-sfx"
          cp examples/script.example.json "$RUNNER_TEMP/voiced-sfx/script.json"
          node dist/cli.js check "$RUNNER_TEMP/voiced-sfx/script.json"
          node dist/cli.js render "$RUNNER_TEMP/voiced-sfx/script.json" --fps 4 --sfx-dir "$sfx" --sfx-credit "効果音: 2 kHz の合成音" -o "$out"
          ./.github/scripts/check-loudness.sh "$RUNNER_TEMP/voiced-sfx/audio.wav" -1.5
          ./.github/scripts/check-loudness.sh "$out" -1
          grep -q '"credit": "効果音: 2 kHz の合成音"' "$RUNNER_TEMP/voiced-sfx/script.json"
      - name: 会話の要約の動画を作る
        run: |
          # サンドボックスでの手順(docs/sandbox.md)と同じく、作業フォルダーで check --json してから、出力先に動画だけを書く
          work="$RUNNER_TEMP/conversation-work"
          out="$RUNNER_TEMP/conversation/summary.mp4"
          mkdir -p "$work"
          cp examples/conversation.example.json "$work/conversation.json"
          node dist/cli.js check "$work/conversation.json" --json --speaker 3 > "$work/check.json"
          node -e '
            const r = require(process.argv[1]);
            console.log(`警告 ${r.issues.length} 件、読み ${r.readings.sentences.length} 文(要確認 ${r.readings.review} 文)`);
            if (r.kind !== "conversation" || r.issues.length || r.readings.status !== "checked") process.exit(1);
          ' "$work/check.json"
          node dist/cli.js render "$work/conversation.json" --speaker 3 --fps 4 -o "$out" --work-dir "$work" --timezone Asia/Tokyo
          test "$(ls "$RUNNER_TEMP/conversation")" = "summary.mp4"
          audio=$(ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 "$out")
          test "$audio" = "aac"
          ./.github/scripts/check-loudness.sh "$work/audio.wav" -1.5
          ./.github/scripts/check-loudness.sh "$out" -1
      - name: 作った動画を保存する
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: voiced-sample
          path: ${{ runner.temp }}/voiced/summary.mp4
          retention-days: 7
          if-no-files-found: ignore
      - name: BGM 付きの動画を保存する
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: voiced-bgm-sample
          path: ${{ runner.temp }}/voiced-bgm/summary.mp4
          retention-days: 7
          if-no-files-found: ignore
      - name: 効果音付きの動画を保存する
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: voiced-sfx-sample
          path: ${{ runner.temp }}/voiced-sfx/summary.mp4
          retention-days: 7
          if-no-files-found: ignore
      - name: 会話の要約の動画を保存する
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conversation-sample
          path: ${{ runner.temp }}/conversation/summary.mp4
          retention-days: 7
          if-no-files-found: ignore
      - name: エンジンのログ
        if: failure()
        run: docker logs voicevox
